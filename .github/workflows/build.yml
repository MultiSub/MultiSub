name: Build Extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8'))"

      - name: Package extension artifact
        run: |
          cd dist
          zip -r ../multisubs-for-hbo-max.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: multisubs-for-hbo-max
          path: multisubs-for-hbo-max.zip
          if-no-files-found: error
