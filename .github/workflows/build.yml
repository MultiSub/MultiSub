name: Build Extensions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extensions
        run: npm run build

      - name: Validate manifests
        run: node -e "for (const name of ['hbo', 'netflix']) JSON.parse(require('fs').readFileSync('dist/' + name + '/manifest.json', 'utf8'))"

      - name: Package extension artifacts
        run: |
          cd dist/hbo
          zip -r ../../multisubs-for-hbo-max.zip .
          cd ../netflix
          zip -r ../../multisubs-for-netflix.zip .

      - name: Upload HBO Max build artifact
        uses: actions/upload-artifact@v4
        with:
          name: multisubs-for-hbo-max
          path: multisubs-for-hbo-max.zip
          if-no-files-found: error

      - name: Upload Netflix build artifact
        uses: actions/upload-artifact@v4
        with:
          name: multisubs-for-netflix
          path: multisubs-for-netflix.zip
          if-no-files-found: error
